name: release-orchestrator

# Listens for release-published events from each manifest-tracked repo. On
# successful release.yml completion for repo R at tag T, the orchestrator:
#   1. Checks out enscrive-deploy/main (using the cross-repo PAT)
#   2. Bumps the corresponding `[overrides]` entry in channels/dev.toml
#   3. Commits + pushes to enscrive-deploy main
#   4. Dispatches manifest.yml to regenerate latest.json on CloudFront, ONLY
#      when the repository variable DEV_AUTO_MANIFEST is 'true' (any case)
#
# TRAIN GATE (Founder release trains, 2026-10-13): merges only rally pins.
# Dev autodeploy watches releases/dev/latest.json, so that file must move only
# when the CI Coordinator cuts a train. Step 4 is therefore held unless the
# repository variable DEV_AUTO_MANIFEST is set to 'true' (the pre-train
# behaviour: every pin bump publishes). Actions expression comparisons are
# case-insensitive, so 'TRUE' and 'True' also enable it. Unset, or any other
# value, means HELD:
# the pin bump in steps 1-3 still happens unchanged, the manifest dispatch is
# skipped, and the run summary says so. To cut a train, run:
#   gh workflow run manifest.yml -R enscrive/enscrive-cli -f channel=dev -f version=<train tag>
# (manifest.yml is workflow_dispatch only and is the sole writer of latest.json.)
#
# PROBE PIN IS TRAIN-ONLY (plan owner ruling, 2026-10-13): an enscrive-control-tower-tui
# release (roster key enscrive-probe, which runs on the dev host as enscrive-probe@dev)
# does NOT bump channels/dev.toml here. The release publishes its artifact only; the
# enscrive-probe pin moves only through an explicit train-item PR to channels/dev.toml.
# The run still succeeds and its summary says the bump was held.
#
# Idempotent: re-running with the same (repo, version) is a no-op.
# Race-safe: concurrency group serializes all writes to dev.toml.
#
# ADR: enscrive-governance/plans/PER-COMPONENT-VERSION-PINNING-2026-05-27/ADR.md
# Linear: ENS-538

on:
  repository_dispatch:
    types: [release-published]
  # Operator backfill / manual trigger
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo name that just published (e.g. enscrive-developer)"
        required: true
        type: string
      version:
        description: "Tag (e.g. v20260601-1700)"
        required: true
        type: string

permissions:
  contents: read
  actions: write   # to dispatch manifest.yml

concurrency:
  # Serialize all dev.toml writes across incoming notifications. The default
  # single-pending queue dropped ESM run 34770140127 during a three-release
  # burst; retain up to GitHub Actions' documented maximum of 100 pending runs.
  # Schema: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency#queueing-multiple-pending-runs
  # queue: max is valid with cancel-in-progress: false; true is incompatible.
  group: dev-toml-write
  cancel-in-progress: false
  queue: max

jobs:
  bump-dev-toml:
    runs-on: ubuntu-latest
    # ENSCRIVE_ORCHESTRATOR_PAT lives only in the release-orchestrator
    # environment (deployment policy: branch main only; repository_dispatch
    # runs on the default branch), so a workflow on any other ref cannot
    # resolve it (L35 actions-secrets containment).
    environment: release-orchestrator
    steps:
      - name: Resolve inputs
        id: input
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          DISPATCH_REPO: ${{ github.event.inputs.repo }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          # Every payload-derived value arrives via `env:` above, never
          # spliced as a GitHub expression into this script body — repository_dispatch
          # client_payload and workflow_dispatch inputs are caller-controlled
          # text, and GitHub expression expansion happens before the shell parses this
          # script, which is the classic GitHub Actions script-injection
          # vector. This step runs before the PAT-holding checkout step, so
          # everything below must fail closed before any git or PAT use.
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            REPO="$PAYLOAD_REPO"
            VERSION="$PAYLOAD_VERSION"
          else
            REPO="$DISPATCH_REPO"
            VERSION="$DISPATCH_VERSION"
          fi

          [ -n "$REPO" ] || { echo "::error::missing repo"; exit 1; }
          [ -n "$VERSION" ] || { echo "::error::missing version"; exit 1; }

          # Explicit allowlist, derived from (and kept in sync with) the
          # roster this workflow's own "Update channels/dev.toml override"
          # step maps to ROSTER_KEY for bump-dev-toml.py below. Reject
          # anything else before the PAT-holding checkout step runs.
          case "$REPO" in
            enscrive-secrets-manager|enscrive-bootstrap-authority|enscrive-control-tower-tui|enscrive-cli|enscrive-developer|enscrive-observe|enscrive-embed|enscrive-metering-sentinel|enscrive-docs)
              ;;
            *)
              echo "::error::repo '$REPO' is not an allowed release-orchestrator caller"
              exit 1 ;;
          esac

          # vYYYYMMDD-HHMM, optionally suffixed with -<7 hex chars> (short SHA).
          if ! [[ "$VERSION" =~ ^v[0-9]{8}-[0-9]{4}(-[0-9a-f]{7})?$ ]]; then
            echo "::error::version '$VERSION' does not match the expected vYYYYMMDD-HHMM[-<sha7>] shape"
            exit 1
          fi

          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Triggered by: repo=$REPO version=$VERSION"

      - name: Checkout enscrive-cli (for the bump generator script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout enscrive-deploy main (PAT for cross-repo write)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: enscrive/enscrive-deploy
          ref: main
          path: _deploy
          token: ${{ secrets.ENSCRIVE_ORCHESTRATOR_PAT }}
          persist-credentials: true

      - name: Update channels/dev.toml override
        id: bump
        shell: bash
        env:
          REPO: ${{ steps.input.outputs.repo }}
          VERSION: ${{ steps.input.outputs.version }}
        working-directory: _deploy
        run: |
          set -euo pipefail

          # Map repo name → roster component key. Most are identity; esm, eba,
          # and the probe are special (signer repo name ≠ roster key).
          case "$REPO" in
            enscrive-secrets-manager) ROSTER_KEY="esm" ;;
            enscrive-bootstrap-authority) ROSTER_KEY="eba" ;;
            # The telemetry probe is built/signed/published by the
            # enscrive-control-tower-tui repo but lands in the roster under the
            # key "enscrive-probe" (see enscrive-deploy/channels/roster.toml).
            # Train-only pin (see the header): do not bump it from a release.
            # Record the hold and leave dev.toml untouched (no_change=true skips
            # the commit and manifest steps).
            enscrive-control-tower-tui)
              echo "Probe release ${VERSION} published; enscrive-probe pin NOT bumped (train-only: move it with a train-item PR to channels/dev.toml)." >> "$GITHUB_STEP_SUMMARY"
              echo "enscrive-probe pin held (train-only)"
              echo "no_change=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            enscrive-cli|enscrive-developer|enscrive-observe|enscrive-embed|enscrive-metering-sentinel|enscrive-docs)
              ROSTER_KEY="$REPO" ;;
            *)
              echo "::error::repo '$REPO' is not in the dev roster"
              exit 1 ;;
          esac

          echo "Bumping [overrides] entry for roster key '$ROSTER_KEY' -> '$VERSION'"
          export ROSTER_KEY VERSION

          # Generator lives in enscrive-cli's own tree (not _deploy's), so
          # reference it relative to GITHUB_WORKSPACE. Extracted from an
          # inline heredoc (2026-07-10) so the monotonic guard is
          # unit-testable; see .github/scripts/bump-dev-toml-test.py.
          python3 "${GITHUB_WORKSPACE}/.github/scripts/bump-dev-toml.py"

          if git diff --quiet channels/dev.toml; then
            echo "no_change=true" >> "$GITHUB_OUTPUT"
            echo "channels/dev.toml unchanged (idempotent)"
          else
            echo "no_change=false" >> "$GITHUB_OUTPUT"
            echo "--- diff ---"
            git --no-pager diff channels/dev.toml
          fi

      - name: Commit + push to enscrive-deploy main
        if: steps.bump.outputs.no_change == 'false'
        working-directory: _deploy
        shell: bash
        env:
          REPO: ${{ steps.input.outputs.repo }}
          VERSION: ${{ steps.input.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "enscrive-orchestrator[bot]"
          git config user.email "orchestrator@enscrive.io"
          # Stage the dev.toml change FIRST so subsequent fetch/rebase don't
          # trip on an unstaged worktree change.
          git add channels/dev.toml
          COMMIT_MSG="Auto-bump dev channel: ${REPO} -> ${VERSION}"$'\n\n'"Triggered by release-published event from ${REPO} at tag ${VERSION}."$'\n\n'"Orchestrator: enscrive-cli/.github/workflows/release-orchestrator.yml"$'\n'"Linear: ENS-538"
          git commit -m "${COMMIT_MSG}"
          # The concurrency: group: dev-toml-write at the workflow level
          # serializes all writes, so racing this push is unlikely. If it
          # does race (another actor pushed concurrently), pull --rebase
          # the staged commit on top and retry once.
          git fetch origin main
          if ! git push origin main 2>&1; then
            echo "::warning::push rejected; rebasing onto origin/main and retrying"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Manifest held for train cut
        if: steps.bump.outputs.no_change == 'false' && vars.DEV_AUTO_MANIFEST != 'true'
        shell: bash
        env:
          REPO: ${{ steps.input.outputs.repo }}
          VERSION: ${{ steps.input.outputs.version }}
        run: |
          set -euo pipefail
          echo "Pins bumped (${REPO} -> ${VERSION}); manifest.yml NOT dispatched, held for a train cut (DEV_AUTO_MANIFEST is not true). Cut with: gh workflow run manifest.yml -R enscrive/enscrive-cli -f channel=dev -f version=<train tag>" >> "$GITHUB_STEP_SUMMARY"
          echo "Manifest dispatch held for train cut"

      - name: Dispatch manifest.yml
        if: steps.bump.outputs.no_change == 'false' && vars.DEV_AUTO_MANIFEST == 'true'
        env:
          GH_TOKEN: ${{ secrets.ENSCRIVE_ORCHESTRATOR_PAT }}
          VERSION: ${{ steps.input.outputs.version }}
        run: |
          set -euo pipefail
          # Brief settling delay so manifest.yml's checkout of enscrive-deploy
          # sees the freshly-pushed commit.
          sleep 5
          # `version` is the just-published tag (becomes manifest.json's
          # `version` + `compatibility.min_cli_version`). Per-component source
          # versions come from channels/dev.toml (now bumped above).
          gh workflow run manifest.yml \
            --repo enscrive/enscrive-cli \
            --ref main \
            -f version="${VERSION}"
          echo "Dispatched manifest.yml with version=${VERSION}"
