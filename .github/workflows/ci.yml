name: ci

# PR-gating CI for the closed-loop dev pipeline (ENS-569). build/test/clippy are
# the required status checks that gate auto-merge. Runs on ubuntu-latest (the
# self-hosted enscrive-builder runners are offline by default).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    # Fleet secret-scan rollout (2026-07-02 audit, cross-cutting risk 02):
    # enscrive-embed's secret-scan job used gitleaks/gitleaks-action, which
    # now requires a paid GITLEAKS_LICENSE secret for organization repos and
    # was failing outright without one. This repo had no secret-scan job at
    # all. Run the gitleaks OSS CLI directly (MIT-licensed, checksum-
    # verified, no license dependency), scoped to only the commits a PR
    # introduces (base..head) so it doesn't trip on pre-existing history.
    # No continue-on-error: a scanner that can't run must fail the PR, not
    # pass it silently.
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            LOG_OPTS="--no-merges --first-parent ${{ github.event.pull_request.base.sha }}^..${{ github.event.pull_request.head.sha }}"
          else
            LOG_OPTS="-1"
          fi
          gitleaks detect \
            --source "$GITHUB_WORKSPACE" \
            --redact --no-banner --exit-code 1 \
            --log-opts="${LOG_OPTS}"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  # ENS-3054 Wave 0: the clean-room onboard gate.
  #
  # Root cause from the debrief (enscrive-governance
  # plans/SOLO-DEV-ONBOARD-REMEDIATION-2026-07-31/DEBRIEF.md §2): nothing
  # ever ran the documented three-command onboard end to end, which is how
  # ten separate defects (D1-D11) shipped without being caught — you cannot
  # reach defect #8 without first fixing #1 through #7. This job runs the
  # real sequence for real, on a clean container:
  #
  #   install.sh -> enscrive init --mode self-managed -> enscrive start
  #   -> enscrive health -> corpus create -> ingest documents -> search
  #
  # against THIS PR's own `enscrive` binary (built from source below) and
  # the latest RELEASED service binaries (enscrive-developer/-observe/
  # -embed/esm/enscrive-docs, fetched from the dev release manifest by
  # `enscrive init` itself — the same default a real solo developer gets).
  # Matrixed across a Docker host and a podman host per DEBRIEF §5 ("zero
  # hand-edited env files... on both a Docker host and a podman host").
  #
  # INTENTIONALLY INFORMATIONAL / NOT REQUIRED. Do not add this job's checks
  # to branch protection's required list — that stays founder-only.
  #
  # D8 (no rate card ever seeded) and D9 (no wallet ever provisioned) —
  # enscrive-developer PR #226, `5da221e`, tag v20260731-0144 — are fixed
  # and released to the dev channel manifest this job fetches from. D1
  # (native podman detection, this PR) is the last defect blocking a fully
  # green podman leg; once it lands, both legs are expected to go green.
  #
  # TODO(ENS-3054 Wave 4): once this job is consistently green on both
  # legs, the founder can promote it to a required branch-protection check.
  # Not done by this PR.
  clean-room-onboard:
    name: clean-room-onboard (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: [build, test, clippy]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: clean-room-onboard-${{ matrix.runtime }}

      # GitHub-hosted runner images ship Docker (moby-*) pre-installed —
      # `docker` is on PATH regardless of the matrix leg. Without this
      # step the podman leg would silently pass by using the runner's
      # stock Docker (detect_container_runtime probes `docker` first, by
      # design — that's correct behavior on a real host with both
      # installed) and never touch podman at all, proving nothing about
      # D1. Remove it so this leg is a genuinely Docker-less host, same as
      # the debrief's real Fedora machine.
      - name: remove pre-installed Docker (podman leg only — prove a genuinely Docker-less host)
        if: matrix.runtime == 'podman'
        run: |
          set -euo pipefail
          sudo systemctl stop docker.socket docker.service 2>/dev/null || true
          sudo apt-get purge -y \
            moby-engine moby-cli moby-buildx moby-compose moby-containerd moby-runc \
            docker-ce docker-ce-cli docker-buildx-plugin docker-compose-plugin containerd.io \
            2>/dev/null || true
          sudo rm -f /usr/bin/docker /usr/local/bin/docker /usr/bin/docker-compose
          if command -v docker >/dev/null 2>&1; then
            echo "docker is still on PATH at $(command -v docker) — leg is not Docker-less" >&2
            exit 1
          fi
          echo "confirmed: no docker binary on PATH"

      # ENS-3054 D1: this PR ships native podman detection in the cli
      # itself (src/local.rs detect_container_runtime / resolve_compose_
      # binary / compose_cmd) — probes docker then podman, resolves the
      # first working compose implementation (docker compose -> podman
      # compose -> podman-compose -> docker-compose), and wires
      # DOCKER_HOST at the rootless podman socket automatically when
      # podman is selected. NO docker shim. This step only installs the
      # runtime + a compose provider and makes sure the rootless socket is
      # already active — the runner's job, not the cli's, in a
      # non-interactive session (the cli's own non-interactive path only
      # ever guides-and-exits if the socket isn't active; it never touches
      # systemd itself, ENS-3054 D1 requirement 4).
      - name: install podman + compose (podman leg only)
        if: matrix.runtime == 'podman'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs

          mkdir -p "$HOME/.local/bin"

          # Standalone docker-compose v2 binary — podman's default
          # compose_providers search includes a bare `docker-compose` on
          # PATH, so this doubles as podman's `podman compose` delegate
          # AND as the cli's own last-resort `docker-compose` fallback.
          # Either way it talks to podman's rootless socket via
          # DOCKER_HOST, which the cli sets itself (compose_cmd) — this
          # step never sets DOCKER_HOST. Verified against docker/compose's
          # own published checksum file (this binary is outside the
          # enscrive supply chain, so there is no in-repo pin to check it
          # against).
          COMPOSE_VERSION="v2.29.7"
          # Downloaded under its upstream filename (not renamed to
          # `docker-compose`) because the published .sha256 file's checksum
          # line references that exact filename — sha256sum -c resolves it
          # relative to cwd, so a rename here would make verification fail
          # with a spurious "No such file or directory".
          curl -fsSL -o /tmp/docker-compose-linux-x86_64 \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          curl -fsSL -o /tmp/docker-compose-linux-x86_64.sha256 \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64.sha256"
          (cd /tmp && sha256sum -c docker-compose-linux-x86_64.sha256)
          install -m 0755 /tmp/docker-compose-linux-x86_64 "$HOME/.local/bin/docker-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # Activate the rootless podman API socket via the real systemd
          # --user unit podman ships (not a hand-rolled `podman system
          # service` background process) — the exact command ENS-3054 D1
          # requirement 4 tells an interactive operator to run by hand.
          systemctl --user enable --now podman.socket
          systemctl --user status podman.socket --no-pager

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      # Exercises the actual documented public onboard step 1 for realism
      # (proves install.enscrive.io + cosign/Fulcio verification still
      # work end to end). Isolated with continue-on-error: this job's
      # signal is about the ENS-3054 W0+W1 fixes below, not about
      # install.enscrive.io's uptime — and the binary it fetches gets
      # replaced with this PR's own build in the next step regardless.
      - name: install.sh (documented public onboard step 1)
        continue-on-error: true
        run: |
          set -euo pipefail
          sh installer/install.sh --prefix="$HOME/.local/bin"

      # Build THIS PR's cli binary and install it over whatever install.sh
      # fetched, so every step from here on tests the PR's actual
      # src/local.rs changes (D2/D4/D5/D6/D10) — not the last release.
      - name: build and install this PR's enscrive binary
        run: |
          set -euo pipefail
          cargo build --release --locked
          mkdir -p "$HOME/.local/bin"
          install -m 0755 target/release/enscrive "$HOME/.local/bin/enscrive"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: enscrive --version
        run: enscrive --version

      # Guards D2 (CATALOG_DB_URL), D5 (shared metering HMAC generated +
      # written to both vaults), D6 (absolute ESM_BINARY in every rendered
      # env) at the moment the env files are written.
      - name: "enscrive init --mode self-managed"
        env:
          ONBOARD_OPENAI_API_KEY: ${{ secrets.ONBOARD_TEST_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          enscrive init --mode self-managed --set-default \
            --openai-api-key "$ONBOARD_OPENAI_API_KEY" \
            --output json

      # Guards D4 (ESM_VAULT_PATH must resolve to a directory, or observe
      # never execs esm at all) and D10 (DEVELOPER_BASE_URL at the real
      # developer port, or every /v1/search 500s downstream).
      - name: "enscrive start"
        run: |
          set -euo pipefail
          enscrive start --output json

      # Confirms the stack Wave 1 unblocked actually serves. Informational
      # capability dump alongside it — not asserted on, since the exact
      # `degraded`/`capabilities` shape is enscrive-developer's contract,
      # not this repo's.
      - name: "enscrive health"
        run: |
          set -euo pipefail
          enscrive health --output json | tee /tmp/health.json
      - name: report health capabilities (informational)
        if: always()
        run: jq '.data // .' /tmp/health.json 2>/dev/null || cat /tmp/health.json || true

      # Guards D8 (no rate card is ever seeded -> "internal error: no
      # active rate card configured" / 500 on every corpus create, DEBRIEF
      # §3) — fixed in enscrive-developer PR #226 and released to the dev
      # channel manifest this job fetches from.
      - name: "enscrive corpus create [guards D8]"
        id: corpus_create
        run: |
          set -euo pipefail
          enscrive corpus create \
            --name "onboard-smoke-${{ matrix.runtime }}-$(date +%s)" \
            --embedding-model text-embedding-3-large \
            --description "ENS-3054 clean-room onboard CI smoke corpus" \
            --output json | tee /tmp/corpus.json
          corpus_id="$(jq -r '.data.id // .data.corpus_id // empty' /tmp/corpus.json)"
          echo "corpus_id=$corpus_id" >> "$GITHUB_OUTPUT"

      # Guards D9 (no tenant wallet is ever provisioned -> 503
      # wallet_unprovisioned on every ingest, DEBRIEF §3) — fixed in the
      # same enscrive-developer PR #226 as D8, above.
      - name: "enscrive ingest documents [guards D9]"
        run: |
          set -euo pipefail
          enscrive ingest documents \
            --corpus-id "${{ steps.corpus_create.outputs.corpus_id }}" \
            --content "Enscrive clean-room onboard smoke test document." \
            --output json

      # The headline feature D10 was breaking outright (every search 500d
      # because observe couldn't reach developer's metering endpoint).
      - name: "enscrive search [guards D10]"
        run: |
          set -euo pipefail
          enscrive search \
            --corpus "${{ steps.corpus_create.outputs.corpus_id }}" \
            --query "smoke test" \
            --output json

      # NOTE (DEBRIEF §4.2, §5 step 8): per-document delete does not exist
      # in the CLI yet (no CorpusSubcommand variant) — it's Wave 4 backlog,
      # not part of this PR. Left out of this job until it ships; the DoD
      # in DEBRIEF §5 lists it as a future step, not a current one.

      - name: collect service logs (always, for postmortem)
        if: always()
        run: |
          set -uo pipefail
          log_dir="$HOME/.local/share/enscrive/runtime/local/logs"
          if [ ! -d "$log_dir" ]; then
            echo "no log dir at $log_dir (enscrive start likely never ran)"
            exit 0
          fi
          for f in "$log_dir"/*.log; do
            echo "===== $f ====="
            tail -n 120 "$f" 2>/dev/null || true
            echo
          done
