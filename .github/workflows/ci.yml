name: ci

# PR-gating CI for the closed-loop dev pipeline (ENS-569). build/test/clippy are
# the required status checks that gate auto-merge. Runs on ubuntu-latest (the
# self-hosted enscrive-builder runners are offline by default).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    # Fleet secret-scan rollout (2026-07-02 audit, cross-cutting risk 02):
    # enscrive-embed's secret-scan job used gitleaks/gitleaks-action, which
    # now requires a paid GITLEAKS_LICENSE secret for organization repos and
    # was failing outright without one. This repo had no secret-scan job at
    # all. Run the gitleaks OSS CLI directly (MIT-licensed, checksum-
    # verified, no license dependency), scoped to only the commits a PR
    # introduces (base..head) so it doesn't trip on pre-existing history.
    # No continue-on-error: a scanner that can't run must fail the PR, not
    # pass it silently.
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            LOG_OPTS="--no-merges --first-parent ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            LOG_OPTS="-1"
          fi
          gitleaks detect \
            --source "$GITHUB_WORKSPACE" \
            --redact --no-banner --exit-code 1 \
            --log-opts="${LOG_OPTS}"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  # ENS-3054 Wave 0: the clean-room onboard gate.
  #
  # Root cause from the debrief (enscrive-governance
  # plans/SOLO-DEV-ONBOARD-REMEDIATION-2026-07-31/DEBRIEF.md §2): nothing
  # ever ran the documented three-command onboard end to end, which is how
  # ten separate defects (D1-D11) shipped without being caught — you cannot
  # reach defect #8 without first fixing #1 through #7. This job runs the
  # real sequence for real, on a clean container:
  #
  #   install.sh -> enscrive init --mode self-managed -> enscrive start
  #   -> enscrive health -> corpus create -> ingest documents -> search
  #
  # against THIS PR's own `enscrive` binary (built from source below) and
  # the latest RELEASED service binaries (enscrive-developer/-observe/
  # -embed/esm/enscrive-docs, fetched from the dev release manifest by
  # `enscrive init` itself — the same default a real solo developer gets).
  # Matrixed across a Docker host and a podman host per DEBRIEF §5 ("zero
  # hand-edited env files... on both a Docker host and a podman host").
  #
  # INTENTIONALLY INFORMATIONAL / NOT REQUIRED. Do not add this job's checks
  # to branch protection's required list — that stays founder-only.
  #
  # D8 (no rate card ever seeded) and D9 (no wallet ever provisioned) —
  # enscrive-developer PR #226, `5da221e`, tag v20260731-0144 — are fixed
  # and released to the dev channel manifest this job fetches from. D1
  # (native podman detection, this PR) is the last defect blocking a fully
  # green podman leg; once it lands, both legs are expected to go green.
  #
  # TODO(ENS-3054 Wave 4): once this job is consistently green on both
  # legs, the founder can promote it to a required branch-protection check.
  # Not done by this PR.
  clean-room-onboard:
    name: clean-room-onboard (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: [build, test, clippy]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: clean-room-onboard-${{ matrix.runtime }}

      # GitHub-hosted runner images ship Docker (moby-*) pre-installed —
      # `docker` is on PATH regardless of the matrix leg. Without this
      # step the podman leg would silently pass by using the runner's
      # stock Docker (detect_container_runtime probes `docker` first, by
      # design — that's correct behavior on a real host with both
      # installed) and never touch podman at all, proving nothing about
      # D1. Remove it so this leg is a genuinely Docker-less host, same as
      # the debrief's real Fedora machine.
      - name: remove pre-installed Docker (podman leg only — prove a genuinely Docker-less host)
        if: matrix.runtime == 'podman'
        run: |
          set -euo pipefail
          sudo systemctl stop docker.socket docker.service 2>/dev/null || true
          sudo apt-get purge -y \
            moby-engine moby-cli moby-buildx moby-compose moby-containerd moby-runc \
            docker-ce docker-ce-cli docker-buildx-plugin docker-compose-plugin containerd.io \
            2>/dev/null || true
          sudo rm -f /usr/bin/docker /usr/local/bin/docker /usr/bin/docker-compose
          if command -v docker >/dev/null 2>&1; then
            echo "docker is still on PATH at $(command -v docker) — leg is not Docker-less" >&2
            exit 1
          fi
          echo "confirmed: no docker binary on PATH"

      # ENS-3054 D1: this PR ships native podman detection in the cli
      # itself (src/local.rs detect_container_runtime / resolve_compose_
      # binary / compose_cmd) — probes docker then podman, resolves the
      # first working compose implementation (docker compose -> podman
      # compose -> podman-compose -> docker-compose), and wires
      # DOCKER_HOST at the rootless podman socket automatically when
      # podman is selected. NO docker shim. This step only installs the
      # runtime + a compose provider and makes sure the rootless socket is
      # already active — the runner's job, not the cli's, in a
      # non-interactive session (the cli's own non-interactive path only
      # ever guides-and-exits if the socket isn't active; it never touches
      # systemd itself, ENS-3054 D1 requirement 4).
      - name: install podman + compose (podman leg only)
        if: matrix.runtime == 'podman'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs

          mkdir -p "$HOME/.local/bin"

          # Standalone docker-compose v2 binary — podman's default
          # compose_providers search includes a bare `docker-compose` on
          # PATH, so this doubles as podman's `podman compose` delegate
          # AND as the cli's own last-resort `docker-compose` fallback.
          # Either way it talks to podman's rootless socket via
          # DOCKER_HOST, which the cli sets itself (compose_cmd) — this
          # step never sets DOCKER_HOST. Verified against docker/compose's
          # own published checksum file (this binary is outside the
          # enscrive supply chain, so there is no in-repo pin to check it
          # against).
          COMPOSE_VERSION="v2.29.7"
          # Downloaded under its upstream filename (not renamed to
          # `docker-compose`) because the published .sha256 file's checksum
          # line references that exact filename — sha256sum -c resolves it
          # relative to cwd, so a rename here would make verification fail
          # with a spurious "No such file or directory".
          curl -fsSL -o /tmp/docker-compose-linux-x86_64 \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          curl -fsSL -o /tmp/docker-compose-linux-x86_64.sha256 \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64.sha256"
          (cd /tmp && sha256sum -c docker-compose-linux-x86_64.sha256)
          install -m 0755 /tmp/docker-compose-linux-x86_64 "$HOME/.local/bin/docker-compose"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          # Activate the rootless podman API socket via the real systemd
          # --user unit podman ships (not a hand-rolled `podman system
          # service` background process) — the exact command ENS-3054 D1
          # requirement 4 tells an interactive operator to run by hand.
          systemctl --user enable --now podman.socket
          systemctl --user status podman.socket --no-pager

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      # Exercises the actual documented public onboard step 1 for realism
      # (proves install.enscrive.io + cosign/Fulcio verification still
      # work end to end). Isolated with continue-on-error: this job's
      # signal is about the ENS-3054 W0+W1 fixes below, not about
      # install.enscrive.io's uptime — and the binary it fetches gets
      # replaced with this PR's own build in the next step regardless.
      - name: install.sh (documented public onboard step 1)
        continue-on-error: true
        run: |
          set -euo pipefail
          sh installer/install.sh --prefix="$HOME/.local/bin"

      # Build THIS PR's cli binary and install it over whatever install.sh
      # fetched, so every step from here on tests the PR's actual
      # src/local.rs changes (D2/D4/D5/D6/D10) — not the last release.
      - name: build and install this PR's enscrive binary
        run: |
          set -euo pipefail
          cargo build --release --locked
          mkdir -p "$HOME/.local/bin"
          install -m 0755 target/release/enscrive "$HOME/.local/bin/enscrive"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: enscrive --version
        run: enscrive --version

      # Guards D2 (CATALOG_DB_URL), D5 (shared metering HMAC generated +
      # written to both vaults), D6 (absolute ESM_BINARY in every rendered
      # env) at the moment the env files are written.
      - name: "enscrive init --mode self-managed"
        env:
          ONBOARD_OPENAI_API_KEY: ${{ secrets.ONBOARD_TEST_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          enscrive init --mode self-managed --set-default \
            --openai-api-key "$ONBOARD_OPENAI_API_KEY" \
            --output json

      # Guards D4 (ESM_VAULT_PATH must resolve to a directory, or observe
      # never execs esm at all) and D10 (DEVELOPER_BASE_URL at the real
      # developer port, or every /v1/search 500s downstream).
      - name: "enscrive start"
        run: |
          set -euo pipefail
          enscrive start --output json

      # Confirms the stack Wave 1 unblocked actually serves. Informational
      # capability dump alongside it — not asserted on, since the exact
      # `degraded`/`capabilities` shape is enscrive-developer's contract,
      # not this repo's.
      - name: "enscrive health"
        run: |
          set -euo pipefail
          enscrive health --output json | tee /tmp/health.json
      - name: report health capabilities (informational)
        if: always()
        run: jq '.data // .' /tmp/health.json 2>/dev/null || cat /tmp/health.json || true

      # Guards D8 (no rate card is ever seeded -> "internal error: no
      # active rate card configured" / 500 on every corpus create, DEBRIEF
      # §3) — fixed in enscrive-developer PR #226 and released to the dev
      # channel manifest this job fetches from.
      - name: "enscrive corpus create [guards D8]"
        id: corpus_create
        run: |
          set -euo pipefail
          enscrive corpus create \
            --name "onboard-smoke-${{ matrix.runtime }}-$(date +%s)" \
            --embedding-model text-embedding-3-large \
            --description "ENS-3054 clean-room onboard CI smoke corpus" \
            --output json | tee /tmp/corpus.json
          corpus_id="$(jq -r '.data.id // .data.corpus_id // empty' /tmp/corpus.json)"
          echo "corpus_id=$corpus_id" >> "$GITHUB_OUTPUT"

      # Guards D9 (no tenant wallet is ever provisioned -> 503
      # wallet_unprovisioned on every ingest, DEBRIEF §3) — fixed in the
      # same enscrive-developer PR #226 as D8, above.
      - name: "enscrive ingest documents [guards D9]"
        run: |
          set -euo pipefail
          enscrive ingest documents \
            --corpus-id "${{ steps.corpus_create.outputs.corpus_id }}" \
            --content "Enscrive clean-room onboard smoke test document." \
            --output json

      # The headline feature D10 was breaking outright (every search 500d
      # because observe couldn't reach developer's metering endpoint).
      #
      # The only search in this job that does NOT go through
      # .github/scripts/es-search.sh, and safely so: it does not redirect,
      # so the response — success or failure envelope — lands on the
      # console and `set -e` catches a non-zero exit. If you ever add a
      # `> file` here, route it through the helper instead; that is exactly
      # the shape that swallows the error (see the helper's header).
      - name: "enscrive search [guards D10]"
        run: |
          set -euo pipefail
          enscrive search \
            --corpus "${{ steps.corpus_create.outputs.corpus_id }}" \
            --query "smoke test" \
            --output json

      # ────────────────────────────────────────────────────────────────
      # Wave 4a — the per-project memory loop (app-memory ADR §7,
      # acceptance items 1-4). Everything below runs against the stack
      # ALREADY started above: a project gets its own TENANT on one shared
      # local stack, which is the whole architecture (ADR §3.1). Booting a
      # second stack here would test the opposite of the design.
      # ────────────────────────────────────────────────────────────────

      # ADR §7 item 1. Also ADR §5 FORBIDDEN ("a committed API key"):
      # proven against the REAL issued key, not a fixture — the key is read
      # from the profile store and searched for under .enscrive/, and is
      # never echoed.
      - name: "project init [ADR §7.1 — marker, no key material, celebratory output]"
        id: project_init
        run: |
          set -euo pipefail
          project="alpha-${{ matrix.runtime }}-$(date +%s)"
          root="$HOME/projects/$project"
          mkdir -p "$root"
          cd "$root"

          # Human output on purpose: the celebration is what a developer
          # sees, and ADR §4 requires it to name the tenant and the portal.
          enscrive project init --name "$project" | tee /tmp/project-init.txt

          test -f .enscrive/config.toml || { echo "FAIL: .enscrive/config.toml missing"; exit 1; }
          test -f .enscrive/AGENT.md   || { echo "FAIL: .enscrive/AGENT.md missing"; exit 1; }

          grep -q "$project" /tmp/project-init.txt \
            || { echo "FAIL: init output does not name the tenant"; exit 1; }
          grep -q "127.0.0.1:3000" /tmp/project-init.txt \
            || { echo "FAIL: init output does not name the portal"; exit 1; }

          tenant_id="$(sed -n 's/^tenant_id *= *"\(.*\)"$/\1/p' .enscrive/config.toml)"
          profile="$(sed -n 's/^profile *= *"\(.*\)"$/\1/p' .enscrive/config.toml)"
          test -n "$tenant_id" || { echo "FAIL: marker carries no tenant_id"; exit 1; }
          test -n "$profile"   || { echo "FAIL: marker carries no profile reference"; exit 1; }

          # The real key for this project, straight out of the key store.
          # Never printed — only tested for absence under .enscrive/.
          key="$(python3 -c 'import os,sys,tomllib; print(tomllib.load(open(os.path.expanduser("~/.config/enscrive/profiles.toml"),"rb"))["profiles"][sys.argv[1]].get("api_key",""))' "$profile")"
          test -n "$key" || { echo "FAIL: no API key stored for profile $profile"; exit 1; }
          if grep -rqF -- "$key" .enscrive/; then
            echo "FAIL: ADR §5 violation — key material found under .enscrive/"; exit 1
          fi
          echo "OK: marker present, references profile by name, carries no key material"

          echo "project=$project"     >> "$GITHUB_OUTPUT"
          echo "root=$root"           >> "$GITHUB_OUTPUT"
          echo "tenant_id=$tenant_id" >> "$GITHUB_OUTPUT"

      # ADR §7 item 2 (remember). Run from INSIDE the project with zero
      # global config — no --api-key, no --profile, no --endpoint. If cwd
      # resolution regresses, this targets the wrong tenant and the recall
      # step below fails.
      - name: "remember [ADR §7.2 — corpus ensure + ingest, zero global config]"
        id: remember
        run: |
          set -euo pipefail
          cd "${{ steps.project_init.outputs.root }}"

          enscrive corpus ensure \
            --name "${{ steps.project_init.outputs.project }}-memory" \
            --embedding-model text-embedding-3-large \
            --description "Wave 4a clean-room memory loop" \
            --output json | tee /tmp/ensure.json
          corpus_id="$(jq -r '.data.id // .data.corpus_id' /tmp/ensure.json)"
          test -n "$corpus_id" && test "$corpus_id" != "null" \
            || { echo "FAIL: corpus ensure returned no id"; exit 1; }
          jq -e '.data.created == true' /tmp/ensure.json >/dev/null \
            || { echo "FAIL: first ensure in a fresh tenant must CREATE"; exit 1; }

          # Idempotence (ENS-3054 W4 §4.3): the second call must return the
          # same corpus and say so, which is what makes it safe for an agent
          # to run at the top of every session.
          enscrive corpus ensure \
            --name "${{ steps.project_init.outputs.project }}-memory" \
            --embedding-model text-embedding-3-large \
            --output json | tee /tmp/ensure2.json
          jq -e '.data.created == false' /tmp/ensure2.json >/dev/null \
            || { echo "FAIL: repeat ensure must not create a second corpus"; exit 1; }
          test "$(jq -r '.data.id // .data.corpus_id' /tmp/ensure2.json)" = "$corpus_id" \
            || { echo "FAIL: repeat ensure returned a DIFFERENT corpus"; exit 1; }

          enscrive ingest documents \
            --corpus-id "$corpus_id" \
            --document-id "wave4a-memory" \
            --content "The Wave4a canary phrase is xyzzy-plugh-${{ matrix.runtime }}; auth tokens are minted in session.rs." \
            --output json

          # Control document, never deleted, matching the SAME query. It is
          # what makes the retire assertion sound: "the target is absent" is
          # a negative, and a negative passes trivially when search is
          # broken, returns an error envelope, or the corpus is empty. The
          # control still being returned proves search was alive and the
          # corpus non-empty at the moment we concluded the delete worked.
          enscrive ingest documents \
            --corpus-id "$corpus_id" \
            --document-id "wave4a-control" \
            --content "The Wave4a canary phrase also appears in this control document, which is never deleted." \
            --output json

          echo "corpus_id=$corpus_id" >> "$GITHUB_OUTPUT"

      # ADR §7 item 2 (recall). Asserts the document comes back with a real
      # score, not merely that the call returned 200.
      - name: "recall [ADR §7.2 — search finds the memory with a real score]"
        run: |
          set -euo pipefail
          cd "${{ steps.project_init.outputs.root }}"

          # Bounded retry: ingest is awaited to terminal status above, but
          # index visibility can trail it by a beat. Bounded so a genuine
          # failure still fails rather than hanging.
          for attempt in 1 2 3 4 5 6; do
            "$GITHUB_WORKSPACE/.github/scripts/es-search.sh" /tmp/recall.json \
              --query "what is the Wave4a canary phrase" \
              --corpus "${{ steps.remember.outputs.corpus_id }}"
            if jq -e '.ok == true and ([.data.results[] | select(.document_id == "wave4a-memory")] | length > 0)' \
                 /tmp/recall.json >/dev/null 2>&1; then
              break
            fi
            echo "attempt $attempt: not indexed yet, retrying"; sleep 5
          done

          jq -e '[.data.results[]? | select(.document_id == "wave4a-memory")] | length > 0' \
            /tmp/recall.json >/dev/null \
            || { echo "FAIL: search did not return the ingested memory"; jq . /tmp/recall.json; exit 1; }
          jq -e '[.data.results[] | select(.document_id == "wave4a-memory") | .score
                  | select(type == "number" and . > 0)] | length > 0' /tmp/recall.json >/dev/null \
            || { echo "FAIL: hit carries no positive numeric score"; jq . /tmp/recall.json; exit 1; }
          echo "OK: recalled with score $(jq -r '[.data.results[] | select(.document_id == "wave4a-memory") | .score][0]' /tmp/recall.json)"

      # ADR §7 item 4 / §5 FORBIDDEN ("a project silently sharing another
      # project's tenant"). A second project on the SAME stack must not see
      # the first one's memory.
      - name: "isolation [ADR §7.4 — a second project cannot see the first's memory]"
        run: |
          set -euo pipefail
          project="beta-${{ matrix.runtime }}-$(date +%s)"
          root="$HOME/projects/$project"
          mkdir -p "$root"
          cd "$root"

          enscrive project init --name "$project" --output json | tee /tmp/beta-init.json
          beta_tenant="$(jq -r '.data.tenant_id' /tmp/beta-init.json)"
          test "$beta_tenant" != "${{ steps.project_init.outputs.tenant_id }}" \
            || { echo "FAIL: second project reused the first project's tenant"; exit 1; }

          enscrive corpus ensure --name "$project-memory" \
            --embedding-model text-embedding-3-large --output json | tee /tmp/beta-ensure.json
          beta_corpus="$(jq -r '.data.id // .data.corpus_id' /tmp/beta-ensure.json)"

          enscrive ingest documents --corpus-id "$beta_corpus" \
            --document-id "beta-memory" \
            --content "Beta project memory: unrelated content about deployment runbooks." \
            --output json

          # ── The ADR §7.4 assertion: beta's own corpus must not contain
          # alpha's memory. Corpus-scoped, matching how every other search
          # in this job runs. Via the shared wrapper, which dumps the
          # response and leaves the envelope for us to assert on.
          "$GITHUB_WORKSPACE/.github/scripts/es-search.sh" /tmp/beta-scoped.json \
            --query "what is the Wave4a canary phrase" --corpus "$beta_corpus"
          # Liveness first, for the same reason as the retire step: the
          # assertions below are negatives, and a negative is free if the
          # search never ran. Beta's OWN document must come back.
          jq -e '.ok == true and (.data.results | type == "array")' /tmp/beta-scoped.json >/dev/null \
            || { echo "FAIL: beta's own scoped search errored"; exit 1; }
          jq -e '[.data.results[] | select(.document_id == "beta-memory")] | length > 0' \
            /tmp/beta-scoped.json >/dev/null \
            || { echo "FAIL: beta cannot even see its OWN memory — search is not live here"; exit 1; }

          # Both of alpha's documents still EXIST at this point: this step
          # deliberately runs BEFORE retire. Ordered the other way the
          # assertion is vacuous — alpha's document would already be
          # deleted, so beta could never return it and this would pass with
          # zero tenant isolation.
          for doc in wave4a-memory wave4a-control; do
            jq -e --arg d "$doc" '[.data.results[] | select(.document_id == $d)] | length == 0' \
              /tmp/beta-scoped.json >/dev/null \
              || { echo "FAIL: project beta can see project alpha's document $doc"; exit 1; }
          done
          if grep -qF "xyzzy-plugh" /tmp/beta-scoped.json; then
            echo "FAIL: alpha's canary content leaked into beta's search results"; exit 1
          fi
          echo "OK: beta sees its own memory and none of alpha's (both alpha docs still exist)"

          # ── Corpus-UNSCOPED search: a standing probe of a KNOWN open
          # defect, deliberately NOT gating.
          #
          # `/v1/search` takes `corpus_id` as optional at every layer — the
          # CLI flag, developer's handler, and `optional string corpus_id`
          # in the embed SearchRequest proto — but omitting it returns
          # HTTP 500 on this stack (first observed by this gate, PR #58).
          # Type-level optionality was not evidence of behavior.
          #
          # It does NOT fail the job, for two reasons. It is a pre-existing
          # product defect rather than anything Wave 4a introduced, and
          # this job is a required check on every PR — gating it would
          # block unrelated work on a bug none of those PRs can fix. The
          # ADR §7.4 isolation assertion above is corpus-scoped and does
          # gate.
          #
          # When it starts returning 200, the leak assertions below become
          # live: embed filters search on corpus_id alone, with no tenant
          # clause in SearchRequest (enscrive-embed
          # docs/state-of-embed/04-SUBSTRATE-AND-SEARCH.md §6 flags this as
          # an intentional v0 gap resting on "a corpus belongs to one
          # tenant"), so an unscoped search is exactly where a cross-tenant
          # leak would surface. Promote this to gating once the 500 is
          # fixed and the leak checks have been seen to pass.
          "$GITHUB_WORKSPACE/.github/scripts/es-search.sh" /tmp/beta-unscoped.json \
            --query "what is the Wave4a canary phrase"
          if ! jq -e '.ok == true' /tmp/beta-unscoped.json >/dev/null 2>&1; then
            echo "KNOWN FINDING (not gating): corpus-unscoped search still fails."
            echo "  Tracked as a product defect; the docs no longer teach it."
          else
            echo "NOTE: corpus-unscoped search now SUCCEEDS — check the leak assertions below,"
            echo "      then promote this probe to gating."
            jq -e '[.data.results[]? | select(.document_id == "wave4a-memory")] | length == 0' \
              /tmp/beta-unscoped.json >/dev/null \
              || { echo "FINDING: unscoped search LEAKED alpha's memory into beta's tenant"; exit 1; }
            if grep -qF "xyzzy-plugh" /tmp/beta-unscoped.json; then
              echo "FINDING: alpha's canary content leaked cross-tenant via unscoped search"; exit 1
            fi
          fi
          echo "OK: ADR §7.4 satisfied — beta's corpus contains none of alpha's memory"

      # ADR §7 item 2 (retire) — the FIRST live end-to-end exercise of the
      # P3 per-document delete path (cli #52 -> developer #229 -> observe
      # #45 -> embed #93) against released binaries. A failure here is a
      # product finding, not a gate defect.
      - name: "retire [ADR §7.2 — delete removes it from search]"
        run: |
          set -euo pipefail
          cd "${{ steps.project_init.outputs.root }}"

          enscrive corpus document delete \
            --corpus-id "${{ steps.remember.outputs.corpus_id }}" \
            --document-id "wave4a-memory" \
            --output json | tee /tmp/delete.json

          # "The target is absent" is a NEGATIVE assertion, and a negative
          # passes trivially when the search never really ran — an error
          # envelope has no `.data.results`, and `[.data.results[]?]` on it
          # is `[]`, which satisfies `length == 0`. Verified: feeding this
          # jq an `{"ok":false,...}` payload returns true.
          #
          # So each attempt must first establish that the search WORKED:
          # `.ok == true`, `.data.results` is genuinely an array, and the
          # never-deleted control document is still returned. Only against
          # a live search over a non-empty corpus does the target's absence
          # mean the delete worked.
          for attempt in 1 2 3 4 5 6; do
            "$GITHUB_WORKSPACE/.github/scripts/es-search.sh" /tmp/after-delete.json \
              --query "what is the Wave4a canary phrase" \
              --corpus "${{ steps.remember.outputs.corpus_id }}"

            if jq -e '.ok == true and (.data.results | type == "array")' \
                 /tmp/after-delete.json >/dev/null 2>&1 \
               && jq -e '[.data.results[] | select(.document_id == "wave4a-control")] | length > 0' \
                 /tmp/after-delete.json >/dev/null 2>&1 \
               && jq -e '[.data.results[] | select(.document_id == "wave4a-memory")] | length == 0' \
                 /tmp/after-delete.json >/dev/null 2>&1; then
              echo "OK: retired memory gone, control document still returned (search proven live)"
              exit 0
            fi
            echo "attempt $attempt: not yet in the expected state, retrying"; sleep 5
          done

          echo "FAIL: delete did not take effect, or search stopped working."
          echo "      Expected: ok=true, control document present, target absent."
          jq . /tmp/after-delete.json || cat /tmp/after-delete.json
          if jq -e '.ok == true' /tmp/after-delete.json >/dev/null 2>&1; then
            echo "      Search succeeded, so this is a P3 delete-path finding, NOT a gate defect."
          else
            echo "      Search itself failed — check the service logs collected below."
          fi
          exit 1

      # ADR §5: "the AGENT.md is a contract: every capability it instructs
      # MUST be exercised by the CI gate, so the agent-usage doc can never
      # drift from what the CLI actually does."
      #
      # The unit test (project::tests::agent_doc_only_teaches_real_commands)
      # proves every invocation PARSES. This proves every command the doc
      # teaches is actually RUN here against a live stack. Adding a verb to
      # AGENT.md without covering it above fails this step by construction.
      - name: "AGENT.md contract [ADR §5 — the gate exercises everything the doc teaches]"
        run: |
          set -euo pipefail
          cd "${{ steps.project_init.outputs.root }}"

          # Command paths this job exercises above, plus the read-only
          # inspection verbs run just below.
          printf '%s\n' \
            'corpus ensure' \
            'corpus list' \
            'ingest documents' \
            'search' \
            'corpus document delete' \
            'status' \
            'corpus documents' \
            'corpus stats' > /tmp/exercised.txt

          # Every `enscrive …` line the generated doc teaches, reduced to
          # its command path. Each word must START with a letter, so the
          # match stops at the first `--flag` while still allowing
          # hyphenated verbs like `pending-delete`.
          grep -oE '^[[:space:]]*enscrive [a-z][a-z0-9-]*([[:space:]]+[a-z][a-z0-9-]*)*' .enscrive/AGENT.md \
            | sed -E 's/^[[:space:]]*enscrive[[:space:]]+//; s/[[:space:]]+$//' \
            | sort -u > /tmp/taught.txt
          echo "AGENT.md teaches:"; cat /tmp/taught.txt

          missing=0
          while read -r cmd; do
            [ -z "$cmd" ] && continue
            grep -qxF "$cmd" /tmp/exercised.txt || {
              echo "FAIL: AGENT.md teaches \`enscrive $cmd\` but this gate never runs it"
              missing=1
            }
          done < /tmp/taught.txt
          [ "$missing" -eq 0 ] || {
            echo "ADR §5: cover it in this job, or stop teaching it in render_agent_doc."
            exit 1
          }

          # Run the inspection verbs the doc teaches, so the claim above is
          # true rather than asserted.
          enscrive corpus list --output json > /dev/null
          enscrive status --output json > /tmp/project-status.json
          enscrive corpus documents --id "${{ steps.remember.outputs.corpus_id }}" --output json > /dev/null
          enscrive corpus stats --id "${{ steps.remember.outputs.corpus_id }}" --output json > /dev/null

          # `enscrive status` inside a project must name that project.
          jq -e --arg p "${{ steps.project_init.outputs.project }}" \
            '.data.project.name == $p' /tmp/project-status.json >/dev/null \
            || { echo "FAIL: status does not report the active project"; jq '.data.project' /tmp/project-status.json; exit 1; }
          echo "OK: every capability AGENT.md teaches is exercised by this gate"

      - name: collect service logs (always, for postmortem)
        if: always()
        run: |
          set -uo pipefail
          log_dir="$HOME/.local/share/enscrive/runtime/local/logs"
          if [ ! -d "$log_dir" ]; then
            echo "no log dir at $log_dir (enscrive start likely never ran)"
            exit 0
          fi
          for f in "$log_dir"/*.log; do
            echo "===== $f ====="
            tail -n 120 "$f" 2>/dev/null || true
            echo
          done
