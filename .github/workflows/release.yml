name: release

# Concurrency, idempotent S3 writes, rerun-safe artifacts, main-ancestry
# check (RELSPLIT-D, fleet fix following ctt #59/#61): the whole workflow
# shares a `release-<tag>` group with `cancel-in-progress: false`, so two
# dispatches for the SAME tag run one at a time instead of interleaving --
# without this, one run's publish could upload the binary while a second
# run's aggregate/sign reads and signs it, mixing generations. Every
# versioned-artifact S3 write (publish's binary/sidecar upload, aggregate's
# SHA256SUMS upload, sign's bundle uploads) uses conditional create
# (`--if-none-match`) and only accepts an existing object if it
# independently verifies against this run's own digest/identity, so even a
# legitimate retry cannot silently clobber or mix generations. `publish`
# verifies, before configuring AWS credentials, that the tagged commit
# (GITHUB_SHA) is protected main's head or an ancestor of it (GitHub
# compare API), so a tag push cannot release a commit that never reached
# protected main. `publish-installer`'s install.sh/`install` alias writes
# are DELIBERATELY EXCLUDED from the idempotent-write pattern: per
# installer/DESIGN-DECISIONS.md §2 they are a mutable "latest" pointer that
# must be overwritable on every release, not a versioned, immutable
# artifact -- `--if-none-match` doesn't apply there.

on:
    push:
      tags:
        - "v*"
    workflow_dispatch:
      inputs:
        ref_name:
          description: "Tag or ref name to use for the artifact path (e.g. v0.1.0)."
          required: true
          type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.ref_name || github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::535002853127:role/enscrive-releases-publisher
  S3_BUCKET: enscrive-install-artifacts-dev
  CF_DISTRIBUTION_ID: EWE9BH1POOS0A
  CHANNEL: dev
  BINARY_NAME: enscrive

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read   # security wave 3 (ENS-6471): no OIDC token in the build job
    strategy:
      fail-fast: false
      matrix:
        include:
          # Phase 0: single Linux target built on GitHub-hosted runners.
          # (Self-hosted EC2 enscrive-builder pool decommissioned 2026-06-19;
          # cut over to ubuntu-latest.)
          # Mac/ARM64/musl deferred to a later phase.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build (native)
        if: matrix.cross == false
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${BINARY_NAME}"
          DST="dist/${BINARY_NAME}-${{ matrix.target }}"
          cp "$SRC" "$DST"
          chmod +x "$DST"
          ls -lh "$DST"

      - name: Compute SHA256 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum "${BINARY_NAME}-${{ matrix.target }}" > "${BINARY_NAME}-${{ matrix.target }}.sha256"
          cat "${BINARY_NAME}-${{ matrix.target }}.sha256"

      - name: Compute SHA256 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "${BINARY_NAME}-${{ matrix.target }}" > "${BINARY_NAME}-${{ matrix.target }}.sha256"
          cat "${BINARY_NAME}-${{ matrix.target }}.sha256"

      - name: Upload artifact for publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enscrive-${{ matrix.target }}
          path: |
            dist/${{ env.BINARY_NAME }}-${{ matrix.target }}
            dist/${{ env.BINARY_NAME }}-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 7
          # overwrite: true so "re-run failed jobs"/"re-run all jobs" does
          # not die on a "name already exists" collision -- v4.6.2 (this
          # pinned commit) supports it. publish still independently
          # re-hashes whatever it downloads against this step's own
          # recorded sha256, so a replaced, non-identical build fails
          # closed there, not silently.
          overwrite: true

  # ---------------------------------------------------------------------------
  # Security wave 3 (ENS-6471): publish has the OIDC permission needed for S3.
  # It verifies the transferred binary bytes against the build-recorded hash
  # before uploading under the existing release object key.
  # ---------------------------------------------------------------------------
  publish:
    name: publish binary to S3
    needs: build
    runs-on: ubuntu-latest
    outputs:
      ref_name: ${{ steps.ref.outputs.ref_name }}
      verified_sha256: ${{ steps.verify.outputs.verified_sha256 }}
    permissions:
      id-token: write   # OIDC -> enscrive-releases-publisher for the S3 upload
      contents: read
    steps:
      - name: Resolve release tag
        id: ref
        shell: bash
        env:
          # The dispatch input reaches the shell only through env, never
          # through GitHub expression expansion inside the script (script injection).
          INPUT_REF_NAME: ${{ github.event.inputs.ref_name }}
          LC_ALL: C
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REF_NAME="${INPUT_REF_NAME}"
            [ "${REF_NAME}" = "${GITHUB_REF_NAME}" ] || fail "ref_name input '${REF_NAME}' differs from the dispatched ref '${GITHUB_REF_NAME}'"
          else
            REF_NAME="${GITHUB_REF_NAME}"
          fi
          [ "${GITHUB_REF}" = "refs/tags/${REF_NAME}" ] || fail "release must run on tag ref refs/tags/${REF_NAME}, not ${GITHUB_REF}"
          [[ "${REF_NAME}" =~ ^v[0-9]{8}-[0-9]{4}(-[0-9a-f]{7})?$ ]] || fail "release ref '${REF_NAME}' is not vYYYYMMDD-HHMM[-sha7]"
          echo "ref_name=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Release ref resolved to: ${REF_NAME}"

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: enscrive-*
          path: dist
          merge-multiple: true

      - name: Verify the binary against the SHA256 the build recorded
        id: verify
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The download must be flat, and every entry name restricted to a
          # safe character set: a hidden entry, subdirectory, or a name
          # containing e.g. a newline could carry a file the dist/* checks
          # below never see, or could defeat the `grep -xF` membership check
          # further down by embedding a line break inside a filename.
          UNEXPECTED="$(find dist -mindepth 1 \( -type d -o -name '.*' -o ! -type f -o -name '*[!A-Za-z0-9._-]*' \) -print)"
          if [ -n "${UNEXPECTED}" ]; then
            echo "::error::unexpected directory, hidden or non-regular entry in dist: ${UNEXPECTED}"
            exit 1
          fi
          SHA_FILES=(dist/*.sha256)
          if [ "${#SHA_FILES[@]}" -eq 0 ]; then
            echo "::error::no SHA256 files were downloaded"
            exit 1
          fi
          : > verified-targets.txt
          VERIFIED_LINES=()
          for SHA_FILE in "${SHA_FILES[@]}"; do
            FILE="$(basename "${SHA_FILE%.sha256}")"
            PREFIX="${BINARY_NAME}-"
            if [[ "${FILE}" != "${PREFIX}"* ]]; then
              echo "::error::SHA256 filename does not start with ${PREFIX}: ${FILE}"
              exit 1
            fi
            TARGET="${FILE#"${PREFIX}"}"
            if [[ ! "${TARGET}" =~ ^[a-z0-9_]+(-[a-z0-9_]+)+$ ]]; then
              echo "::error::invalid target in SHA256 filename: ${TARGET}"
              exit 1
            fi
            mapfile -t RECORDS < "${SHA_FILE}" || {
              echo "::error::could not read SHA256 file: ${SHA_FILE}"
              exit 1
            }
            if [ "${#RECORDS[@]}" -ne 1 ]; then
              echo "::error::SHA256 file must contain exactly one line: ${SHA_FILE}"
              exit 1
            fi
            LINE="${RECORDS[0]}"
            HASH="${LINE:0:64}"
            if [[ ! "${HASH}" =~ ^[0-9a-f]{64}$ ]] || [ "${LINE}" != "${HASH}  ${FILE}" ]; then
              echo "::error::invalid SHA256 record for target ${TARGET}"
              exit 1
            fi
            if [ ! -f "dist/${FILE}" ]; then
              echo "::error::binary missing for target ${TARGET}: dist/${FILE}"
              exit 1
            fi
            ACTUAL="$(sha256sum "dist/${FILE}" | cut -d' ' -f1)" || {
              echo "::error::could not compute SHA256 for target ${TARGET}"
              exit 1
            }
            if [ "${ACTUAL}" != "${HASH}" ]; then
              echo "::error::SHA256 mismatch for target ${TARGET}: expected ${HASH}, actual ${ACTUAL}"
              exit 1
            fi
            printf '%s\n' "${TARGET}" >> verified-targets.txt
            VERIFIED_LINES+=("${LINE}")
            echo "verified ${TARGET} ${HASH}"
          done
          # dist/ holds the downloaded binary and its .sha256 side by side;
          # every non-.sha256 file must correspond to a verified record.
          DIST_FILES=(dist/*)
          for DIST_PATH in "${DIST_FILES[@]}"; do
            BASE="$(basename "${DIST_PATH}")"
            [[ "${BASE}" == *.sha256 ]] && continue
            if [ ! -f "${DIST_PATH}" ]; then
              echo "::error::unverified file in dist: ${BASE}"
              exit 1
            fi
            if [[ "${BASE}" != "${BINARY_NAME}-"* ]]; then
              echo "::error::unverified file in dist: ${BASE}"
              exit 1
            fi
            TARGET="${BASE#"${BINARY_NAME}-"}"
            if ! grep -qxF "${TARGET}" verified-targets.txt; then
              echo "::error::unverified file in dist: ${BASE}"
              exit 1
            fi
          done
          # The verified set must equal this repo's build matrix EXACTLY (the
          # same target sign checks). An extra or missing target fails here,
          # before anything is uploaded or released.
          EXPECTED_TARGETS=(
            x86_64-unknown-linux-gnu
          )
          mapfile -t GOT < <(sort verified-targets.txt)
          mapfile -t WANT < <(printf '%s\n' "${EXPECTED_TARGETS[@]}" | sort)
          if [ "${GOT[*]}" != "${WANT[*]}" ]; then
            echo "::error::verified targets (${GOT[*]}) differ from the release matrix (${WANT[*]})"
            exit 1
          fi
          { echo "verified_sha256<<VERIFIED_SHA256_EOF"; printf '%s\n' "${VERIFIED_LINES[@]}"; echo "VERIFIED_SHA256_EOF"; } >> "$GITHUB_OUTPUT"
          echo "Verified SHA256 records:"
          printf '%s\n' "${VERIFIED_LINES[@]}"

      - name: Verify tagged commit reached protected main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A tag push can name ANY commit -- tag-push access alone would
          # otherwise let anyone release a commit that never reached
          # protected main. GITHUB_SHA is the commit this tag points to.
          # Ancestor check (compare status in {identical, behind}), not
          # equality: a retry after main has advanced past this commit
          # still succeeds instead of leaving a partially-published tag
          # stuck forever, while a force-push rewrite still fails closed
          # (neither identical to nor an ancestor of the new head).
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq 'select(.protected == true) | .name')" = "main"
          MAIN_COMPARE_STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" --jq '.status')"
          case "${MAIN_COMPARE_STATUS}" in
            identical|behind) : ;;
            *) echo "::error::tagged commit ${GITHUB_SHA} is not protected main's head or an ancestor of it (compare status: ${MAIN_COMPARE_STATUS})"; exit 1 ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload binary to S3
        shell: bash
        env:
          REF_NAME: ${{ steps.ref.outputs.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -s verified-targets.txt ]; then
            echo "::error::verified-targets.txt is empty"
            exit 1
          fi

          # Conditional creation: an existing object is never silently
          # overwritten. On a 412 conflict -- a concurrent run for the same
          # tag that won the race despite the workflow-level concurrency
          # group, or a re-run after a partial failure -- fetch the existing
          # object and continue ONLY if it already matches this run's
          # independently verified digest; otherwise this tag is genuinely
          # contested and the run fails rather than silently mixing
          # generations across runs.
          put_or_verify_existing() {
            local key="$1" body="$2" expected_hash="$3" err tmp actual
            err="$(mktemp)"
            if aws s3api put-object --bucket "${S3_BUCKET}" --key "${key}" \
                --body "${body}" --if-none-match '*' \
                --cache-control "public, max-age=31536000, immutable" \
                >/dev/null 2>"${err}"; then
              rm -f "${err}"
              echo "Published ${key}."
              return 0
            fi
            if grep -qi 'PreconditionFailed' "${err}"; then
              rm -f "${err}"
              echo "::warning::${key} already exists -- verifying it matches this run's verified digest"
              tmp="$(mktemp)"
              aws s3 cp "s3://${S3_BUCKET}/${key}" "${tmp}" --only-show-errors
              actual="$(sha256sum "${tmp}" | cut -d' ' -f1)"
              rm -f "${tmp}"
              if [ "${actual}" != "${expected_hash}" ]; then
                echo "::error::${key} already exists with a DIFFERENT digest (expected ${expected_hash}, got ${actual}) -- this tag is unusable; use a fresh one" >&2
                return 1
              fi
              echo "${key} already published with the expected digest; continuing."
              return 0
            fi
            echo "::error::failed to publish ${key}" >&2
            cat "${err}" >&2
            rm -f "${err}"
            return 1
          }

          while IFS= read -r TARGET; do
            BINARY_HASH="$(sha256sum "dist/${BINARY_NAME}-${TARGET}" | cut -d' ' -f1)"
            SIDECAR_HASH="$(sha256sum "dist/${BINARY_NAME}-${TARGET}.sha256" | cut -d' ' -f1)"
            put_or_verify_existing \
              "releases/${CHANNEL}/${REF_NAME}/${TARGET}/${BINARY_NAME}" \
              "dist/${BINARY_NAME}-${TARGET}" \
              "${BINARY_HASH}"
            put_or_verify_existing \
              "releases/${CHANNEL}/${REF_NAME}/${TARGET}/${BINARY_NAME}.sha256" \
              "dist/${BINARY_NAME}-${TARGET}.sha256" \
              "${SIDECAR_HASH}"
          done < verified-targets.txt

  aggregate:
    name: aggregate + release
    needs: [build, publish]
    runs-on: ubuntu-latest
    # DEVIATION from the standard publish/aggregate/sign template: aggregate
    # also creates the GitHub Release (softprops/action-gh-release), which
    # needs contents: write on this job's token. It is the only job in this
    # workflow with a broader-than-id-token/contents:read permission set.
    # It never executes build's output: it writes SHA256SUMS from publish's
    # verified digests and re-downloads the build artifact only to attach it
    # to the GitHub Release as a file.
    permissions:
      id-token: write   # OIDC for the SHA256SUMS upload and CloudFront invalidation
      contents: write   # softprops/action-gh-release needs this to create the release
    env:
      REF_NAME: ${{ needs.publish.outputs.ref_name }}
      VERIFIED_SHA256: ${{ needs.publish.outputs.verified_sha256 }}
      LC_ALL: C
    steps:
      # No checkout: this job only ever reads publish's verified digests and
      # the downloaded build artifact. Skipping it also means there is no
      # repo-tracked path that could pre-populate `dist/` before it is
      # created below.
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: enscrive-*
          path: artifacts
          merge-multiple: true

      - name: Flatten build artifact for the GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Attach ONLY the files publish verified: each name comes from
          # publish's verified lines, must exist exactly once at the top level
          # of the download, and must match its verified digest. Nothing else
          # from the download (extra, nested or hidden files) is attached.
          mapfile -t LINES < <(printf '%s' "${VERIFIED_SHA256}")
          [ "${#LINES[@]}" -gt 0 ] || { echo "::error::publish provided no verified SHA256 lines"; exit 1; }
          for LINE in "${LINES[@]}"; do
            [[ "${LINE}" =~ ^[0-9a-f]{64}\ \ ${BINARY_NAME}-[a-z0-9_]+(-[a-z0-9_]+)+$ ]] || { echo "::error::invalid verified SHA256 record: ${LINE}"; exit 1; }
            NAME="${LINE:66}"
            [ -f "artifacts/${NAME}" ] && [ ! -L "artifacts/${NAME}" ] || { echo "::error::verified file missing from the download: ${NAME}"; exit 1; }
            cp "artifacts/${NAME}" "dist/${NAME}"
          done
          (cd dist && printf '%s\n' "${LINES[@]}" | sha256sum --strict --check -) || { echo "::error::release asset does not match its verified digest"; exit 1; }
          ls -lh dist/

      - name: Assemble SHA256SUMS from verified digests
        shell: bash
        run: |
          set -euo pipefail
          [[ "${REF_NAME}" =~ ^v[0-9]{8}-[0-9]{4}(-[0-9a-f]{7})?$ ]] || { echo "::error::invalid release ref '${REF_NAME}'"; exit 1; }
          mapfile -t LINES < <(printf '%s' "${VERIFIED_SHA256}")
          if [ "${#LINES[@]}" -eq 0 ]; then
            echo "::error::publish provided no verified SHA256 lines"
            exit 1
          fi
          RECORD_RE="^[0-9a-f]{64}  ${BINARY_NAME}-[a-z0-9_]+(-[a-z0-9_]+)+$"
          for LINE in "${LINES[@]}"; do
            if [[ ! "${LINE}" =~ ${RECORD_RE} ]]; then
              echo "::error::invalid verified SHA256 record: ${LINE}"
              exit 1
            fi
          done
          # Lines come directly from publish's verified output, not from
          # re-hashing the re-downloaded artifact.
          printf '%s\n' "${LINES[@]}" > dist/SHA256SUMS
          echo "Assembled SHA256SUMS:"
          cat dist/SHA256SUMS

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload SHA256SUMS to S3
        shell: bash
        run: |
          set -euo pipefail

          # Conditional creation: an existing object is never silently
          # overwritten. On a 412 conflict -- a concurrent run for the same
          # tag that won the race despite the workflow-level concurrency
          # group, or a re-run after a partial failure -- fetch the existing
          # object and continue ONLY if it already matches this run's
          # independently assembled SHA256SUMS; otherwise this tag is
          # genuinely contested and the run fails rather than silently
          # mixing generations across runs.
          KEY="releases/${CHANNEL}/${REF_NAME}/SHA256SUMS"
          BODY="dist/SHA256SUMS"
          EXPECTED_HASH="$(sha256sum "${BODY}" | cut -d' ' -f1)"
          ERR="$(mktemp)"
          if aws s3api put-object --bucket "${S3_BUCKET}" --key "${KEY}" \
              --body "${BODY}" --if-none-match '*' \
              --cache-control "public, max-age=31536000, immutable" \
              >/dev/null 2>"${ERR}"; then
            rm -f "${ERR}"
            echo "Published ${KEY}."
          elif grep -qi 'PreconditionFailed' "${ERR}"; then
            rm -f "${ERR}"
            echo "::warning::${KEY} already exists -- verifying it matches this run's assembled SHA256SUMS"
            TMP="$(mktemp)"
            aws s3 cp "s3://${S3_BUCKET}/${KEY}" "${TMP}" --only-show-errors
            ACTUAL_HASH="$(sha256sum "${TMP}" | cut -d' ' -f1)"
            rm -f "${TMP}"
            if [ "${ACTUAL_HASH}" != "${EXPECTED_HASH}" ]; then
              echo "::error::${KEY} already exists with a DIFFERENT digest (expected ${EXPECTED_HASH}, got ${ACTUAL_HASH}) -- this tag is unusable; use a fresh one" >&2
              exit 1
            fi
            echo "${KEY} already published with the expected digest; continuing."
          else
            echo "::error::failed to publish ${KEY}" >&2
            cat "${ERR}" >&2
            rm -f "${ERR}"
            exit 1
          fi

      - name: Invalidate CloudFront
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/releases/${CHANNEL}/${REF_NAME}/*"

      - name: Determine prerelease flag
        id: prerelease
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REF_NAME}" == *-alpha* || "${REF_NAME}" == *-beta* || "${REF_NAME}" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.publish.outputs.ref_name }}
          name: ${{ needs.publish.outputs.ref_name }}
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Verification

            Checksums: `curl -fsSL https://developer.enscrive.io/releases/dev/${{ needs.publish.outputs.ref_name }}/SHA256SUMS | sha256sum -c --ignore-missing`

            Signatures: `cosign verify-blob --bundle <artifact>.bundle --certificate-identity-regexp '^https://github\.com/enscrive/enscrive-cli/\.github/workflows/release\.yml@refs/tags/${{ needs.publish.outputs.ref_name }}$' --certificate-oidc-issuer https://token.actions.githubusercontent.com <artifact>`
          files: |
            dist/enscrive-*
            dist/SHA256SUMS

  # ---------------------------------------------------------------------------
  # ENS-82 / CLI-REL-011 — cosign keyless signing.
  # Signs the per-platform binary and bare SHA256SUMS after re-verifying both
  # against publish's verified digest output. Bundles are uploaded to S3.
  # ---------------------------------------------------------------------------
  sign:
    name: cosign keyless signing
    needs: [build, publish, aggregate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # VENDORED from enscrive-runners/.github/actions/install-cosign-verified
      # (2026-07-18): enscrive-cli is a PUBLIC repo and GitHub never resolves
      # a private repo's actions from a public caller — no org access setting
      # changes that. The `uses:` form broke EVERY release since #40 landed
      # it (v20260711-1523 → v20260714-1954, "Unable to resolve action"),
      # leaving the shipped CLI binary a week stale (ENS-1608 + ~40 dupes).
      # Behavior below is byte-faithful to the canonical action (retry +
      # digest-pin + verified install); keep the digest table in sync with the
      # canonical copy via reviewed PRs. ENS-857 (no fleet workflow sync)
      # tracks the drift class.
      - name: "Install cosign (ENS-1177 pattern, vendored: fetch with retries + digest pin)"
        shell: bash
        env:
          COSIGN_VERSION: v2.5.2
          INSTALL_DIR: ${{ runner.temp }}/cosign-verified
          RUNNER_OS_IN: ${{ runner.os }}
          RUNNER_ARCH_IN: ${{ runner.arch }}
        run: |
          set -euo pipefail
          declare -A PINNED_SHA256=(
            [v2.5.2/linux-amd64]="bcfeae05557a9f313ee4392d2f335d0ff69ebbfd232019e3736fb04999fe1734"
            [v2.5.2/linux-arm64]="2cbcea1873ad76274c3f241ef175d204654e3aac3e73e6ec4504e5227015cb0a"
            [v2.5.2/darwin-amd64]="0681abe20a482f4b9b3ed65b3debb8c6346591f2dc484b6bfa79609ff1318de4"
            [v2.5.2/darwin-arm64]="51fdc6d8da8310d72df10065a52247b6bebfe990d4c946dd9f71e17588256011"
          )
          case "${RUNNER_OS_IN}" in
            Linux)  plat_os="linux"  ;;
            macOS)  plat_os="darwin" ;;
            *) echo "::error::vendored install-cosign-verified: unsupported runner.os '${RUNNER_OS_IN}'"; exit 1 ;;
          esac
          case "${RUNNER_ARCH_IN}" in
            X64)   plat_arch="amd64" ;;
            ARM64) plat_arch="arm64" ;;
            *) echo "::error::vendored install-cosign-verified: unsupported runner.arch '${RUNNER_ARCH_IN}'"; exit 1 ;;
          esac
          platform="${plat_os}-${plat_arch}"
          key="${COSIGN_VERSION}/${platform}"
          expected_sha256="${PINNED_SHA256[${key}]:-}"
          if [[ -z "${expected_sha256}" ]]; then
            echo "::error::vendored install-cosign-verified: no pinned digest for ${key}."
            exit 1
          fi
          mkdir -p "${INSTALL_DIR}"
          target="${INSTALL_DIR}/cosign"
          verify_sha256() {
            local actual
            actual=$(sha256sum "$1" | cut -d' ' -f1)
            [[ "${actual}" == "${expected_sha256}" ]]
          }
          download=$(mktemp "${INSTALL_DIR}/.cosign-download.XXXXXX")
          trap 'rm -f "${download}"' EXIT
          url="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-${platform}"
          echo "Fetching ${url} ..."
          attempt=0
          max_attempts=3
          until curl \
            --fail --show-error --silent --location \
            --retry 5 --retry-all-errors --retry-delay 3 --retry-max-time 90 \
            --connect-timeout 10 --max-time 60 \
            -o "${download}" \
            "${url}"; do
            attempt=$((attempt + 1))
            if [[ "${attempt}" -ge "${max_attempts}" ]]; then
              echo "::error::vendored install-cosign-verified: exhausted ${max_attempts} outer attempts fetching ${url}"
              exit 1
            fi
            backoff=$((10 * attempt))
            echo "::warning::vendored install-cosign-verified: fetch attempt ${attempt} failed, backing off ${backoff}s..."
            sleep "${backoff}"
          done
          if ! verify_sha256 "${download}"; then
            echo "::error::vendored install-cosign-verified: downloaded cosign does NOT match the pinned sha256. Refusing to install. expected=${expected_sha256}"
            exit 1
          fi
          mv -T "${download}" "${target}"
          chmod +x "${target}"
          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"
          echo "cosign ${COSIGN_VERSION} (${platform}) fetched, verified, and installed at ${target}."

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign required binary and canonical checksum index
        shell: bash
        env:
          # the checked tag and verified digests from publish; never
          # GITHUB_REF_NAME, which is unvalidated.
          REF_NAME: ${{ needs.publish.outputs.ref_name }}
          VERIFIED_SHA256: ${{ needs.publish.outputs.verified_sha256 }}
          LC_ALL: C
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "${REF_NAME}" =~ ^v[0-9]{8}-[0-9]{4}(-[0-9a-f]{7})?$ ]] || fail "invalid release ref '${REF_NAME}'"

          TARGET="x86_64-unknown-linux-gnu"
          WORK_DIR="/tmp/cosign-work"
          mkdir -p "${WORK_DIR}"

          # Idempotent bundle publication: on a 412 conflict -- a concurrent
          # run for the same tag that won the race despite the
          # workflow-level concurrency group, or a re-run after a partial
          # failure -- an existing bundle is accepted only if it itself
          # verifies with cosign against this run's exact, tag-anchored
          # identity for the bytes on hand -- never assumed good just
          # because the key exists. cosign signatures are non-deterministic
          # (a fresh Fulcio cert + Rekor entry every sign-blob call), so a
          # freshly re-signed bundle can never byte-match one already
          # published; on a verified conflict this moves the EXISTING
          # bundle into place instead of discarding it, so the local file
          # matches what S3 actually serves.
          put_bundle_or_verify_existing() {
            local key="$1" bundle_path="$2" original_path="$3" err tmp
            err="$(mktemp)"
            if aws s3api put-object --bucket "${S3_BUCKET}" --key "${key}" \
                --body "${bundle_path}" --if-none-match '*' \
                --cache-control "public, max-age=31536000, immutable" \
                >/dev/null 2>"${err}"; then
              rm -f "${err}"
              echo "Published ${key}."
              return 0
            fi
            if grep -qi 'PreconditionFailed' "${err}"; then
              rm -f "${err}"
              echo "::warning::${key} already exists -- verifying it against the pinned identity"
              tmp="$(mktemp)"
              aws s3 cp "s3://${S3_BUCKET}/${key}" "${tmp}" --only-show-errors
              if ! cosign verify-blob --bundle "${tmp}" \
                  --certificate-identity-regexp "^https://github\.com/enscrive/enscrive-cli/\.github/workflows/release\.yml@refs/tags/${REF_NAME}\$" \
                  --certificate-github-workflow-sha "${GITHUB_SHA}" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  "${original_path}"; then
                rm -f "${tmp}"
                echo "::error::${key} already exists but does not verify against the pinned identity -- this tag is unusable; use a fresh one" >&2
                return 1
              fi
              mv "${tmp}" "${bundle_path}"
              echo "${key} already published and verifies; using the existing bundle."
              return 0
            fi
            echo "::error::failed to publish ${key}" >&2
            cat "${err}" >&2
            rm -f "${err}"
            return 1
          }

          mapfile -t LINES < <(printf '%s' "${VERIFIED_SHA256}")
          [ "${#LINES[@]}" -gt 0 ] || fail "publish supplied no verified SHA256 lines"
          declare -A EXPECTED=()
          for LINE in "${LINES[@]}"; do
            HASH="${LINE:0:64}"
            [[ "${HASH}" =~ ^[0-9a-f]{64}$ ]] || fail "malformed verified SHA256 digest"
            [ "${LINE:64:2}" = "  " ] || fail "malformed verified SHA256 separator"
            NAME="${LINE:66}"
            [ -n "${NAME}" ] || fail "verified SHA256 record has an empty filename"
            [[ "${NAME}" =~ ^${BINARY_NAME}-[a-z0-9_]+(-[a-z0-9_]+)+$ ]] || fail "malformed verified SHA256 filename '${NAME}'"
            [ -z "${EXPECTED[${NAME}]+present}" ] || fail "duplicate verified SHA256 filename '${NAME}'"
            EXPECTED["${NAME}"]="${LINE}"
          done
          [ "${#EXPECTED[@]}" -eq 1 ] || fail "verified SHA256 filename set does not match signing targets"
          EXPECTED_NAME="${BINARY_NAME}-${TARGET}"
          [ -n "${EXPECTED[${EXPECTED_NAME}]+present}" ] || fail "missing verified SHA256 record for ${EXPECTED_NAME}"

          BINARY_KEY="releases/${CHANNEL}/${REF_NAME}/${TARGET}/${BINARY_NAME}"
          BINARY_LOCAL="${WORK_DIR}/${BINARY_NAME}-${TARGET}"
          echo "Downloading s3://${S3_BUCKET}/${BINARY_KEY} ..."
          aws s3 cp "s3://${S3_BUCKET}/${BINARY_KEY}" "${BINARY_LOCAL}"
          EXPECTED_LINE="${EXPECTED[${EXPECTED_NAME}]}"
          (cd "${WORK_DIR}" && printf '%s\n' "${EXPECTED_LINE}" | sha256sum --check --strict -) || fail "S3 object ${BINARY_KEY} does not match the digest publish verified"

          cosign sign-blob \
            --yes \
            --bundle "${BINARY_LOCAL}.bundle" \
            "${BINARY_LOCAL}"
          cosign verify-blob \
            --bundle "${BINARY_LOCAL}.bundle" \
            --certificate-identity-regexp "^https://github\.com/enscrive/enscrive-cli/\.github/workflows/release\.yml@refs/tags/${REF_NAME}\$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${BINARY_LOCAL}"
          put_bundle_or_verify_existing "${BINARY_KEY}.bundle" "${BINARY_LOCAL}.bundle" "${BINARY_LOCAL}"

          SUMS_KEY="releases/${CHANNEL}/${REF_NAME}/SHA256SUMS"
          SUMS_LOCAL="${WORK_DIR}/SHA256SUMS"
          echo "Downloading s3://${S3_BUCKET}/${SUMS_KEY} ..."
          aws s3 cp "s3://${S3_BUCKET}/${SUMS_KEY}" "${SUMS_LOCAL}"
          cmp -s <(printf '%s\n' "${LINES[@]}") "${SUMS_LOCAL}" || fail "downloaded SHA256SUMS differs from the lines publish verified"

          cosign sign-blob \
            --yes \
            --bundle "${SUMS_LOCAL}.bundle" \
            "${SUMS_LOCAL}"
          cosign verify-blob \
            --bundle "${SUMS_LOCAL}.bundle" \
            --certificate-identity-regexp "^https://github\.com/enscrive/enscrive-cli/\.github/workflows/release\.yml@refs/tags/${REF_NAME}\$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${SUMS_LOCAL}"
          put_bundle_or_verify_existing "${SUMS_KEY}.bundle" "${SUMS_LOCAL}.bundle" "${SUMS_LOCAL}"

  # ---------------------------------------------------------------------------
  # Publish the installer itself — ONE object, one alias, no drift.
  #
  # install.sh was previously published by hand (`aws s3 cp`, per a comment in
  # its own header), separately to the `install.sh` key and the extensionless
  # `install` alias. Two hand-uploaded copies of a security-critical
  # `curl | sh` target drift, and they did: live probes on 2026-08-01 found
  # install.enscrive.io/install.sh and /install both 200 but serving DIFFERENT
  # objects (15,582 vs 15,496 bytes).
  #
  # This job makes that structurally impossible. It uploads `install.sh` once,
  # then produces `install` by a server-side S3 copy of that exact object — a
  # copy, never a second upload — and refuses to finish unless both keys report
  # the same ETag. Both CloudFront paths are then invalidated together.
  # Governance: installer/DESIGN-DECISIONS.md §2.
  # ---------------------------------------------------------------------------
  publish-installer:
    name: publish installer (install.sh + /install alias)
    # Waits on publish, aggregate AND sign (not just aggregate) so install.sh
    # never advances in a run that sign later rejects: a publish that failed
    # its digest re-check, or a signing failure, must not leave a fresh
    # installer live while the binary it points at is unsigned or unverified.
    needs: [publish, aggregate, sign]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC role assumption
      contents: read
    env:
      # Small max-age: the installer is a pointer document, not an immutable
      # artifact, and a bad one should be correctable in minutes.
      INSTALLER_CONTENT_TYPE: "text/x-shellscript; charset=utf-8"
      INSTALLER_CACHE_CONTROL: "public, max-age=300"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload install.sh (the one canonical object)
        shell: bash
        run: |
          set -euo pipefail
          # RELSPLIT-D: this write is DELIBERATELY excluded from the
          # `--if-none-match` idempotent-write pattern used for the
          # versioned artifacts above. install.sh is a mutable "latest"
          # pointer (see the job header and installer/DESIGN-DECISIONS.md
          # §2) that every release must be able to overwrite -- unlike
          # releases/<tag>/... objects, this key is not append-only, so
          # conditional-create would make every release after the first
          # fail here permanently.
          [ -f installer/install.sh ] && [ ! -L installer/install.sh ] || {
            echo "::error::installer/install.sh is missing or not a regular file"
            exit 1
          }
          aws s3 cp \
            installer/install.sh \
            "s3://${S3_BUCKET}/install.sh" \
            --content-type "${INSTALLER_CONTENT_TYPE}" \
            --cache-control "${INSTALLER_CACHE_CONTROL}"

      - name: Copy that object to the /install alias key (server-side, never a second upload)
        shell: bash
        run: |
          set -euo pipefail
          # S3 CopyObject: the alias body is the canonical object's body by
          # construction. --metadata-directive REPLACE is required to keep the
          # shellscript content-type on a key with no extension, which the CLI
          # would otherwise guess as binary/octet-stream.
          aws s3 cp \
            "s3://${S3_BUCKET}/install.sh" \
            "s3://${S3_BUCKET}/install" \
            --metadata-directive REPLACE \
            --content-type "${INSTALLER_CONTENT_TYPE}" \
            --cache-control "${INSTALLER_CACHE_CONTROL}"

      - name: Assert both keys are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          # Both objects are single-part uploads of the same small file, so
          # ETag is the MD5 of the body and comparing them proves byte
          # identity. Sizes are printed too, because size is the symptom the
          # drift was originally caught by.
          #
          # Each head-object goes into its own assignment rather than inline
          # into `read`: a command substitution that dies inside a here-string
          # leaves `read` exiting 0 with empty fields, and two empty strings
          # compare equal — an assertion that passes precisely when it cannot
          # see anything. `VAR=$(...)` under `set -e` aborts on failure, and
          # the emptiness guard below covers the rest.
          CANON=$(aws s3api head-object \
            --bucket "${S3_BUCKET}" --key "install.sh" \
            --query '[ETag,ContentLength]' --output text)
          ALIAS=$(aws s3api head-object \
            --bucket "${S3_BUCKET}" --key "install" \
            --query '[ETag,ContentLength]' --output text)

          read -r CANON_ETAG CANON_SIZE <<<"${CANON}"
          read -r ALIAS_ETAG ALIAS_SIZE <<<"${ALIAS}"

          echo "install.sh  etag=${CANON_ETAG:-<none>} size=${CANON_SIZE:-<none>}"
          echo "install     etag=${ALIAS_ETAG:-<none>} size=${ALIAS_SIZE:-<none>}"

          if [ -z "${CANON_ETAG:-}" ] || [ -z "${ALIAS_ETAG:-}" ]; then
            echo "::error::could not read an ETag for one or both installer keys — refusing to report identity we did not verify." >&2
            exit 1
          fi

          if [ "${CANON_ETAG}" != "${ALIAS_ETAG}" ]; then
            echo "::error::install.sh and its /install alias are NOT byte-identical. The alias must be a copy of the canonical object, never a separate upload." >&2
            exit 1
          fi
          echo "Both keys serve one identical object."

      - name: Invalidate both CloudFront paths
        shell: bash
        run: |
          set -euo pipefail
          # Invalidated together — a partial invalidation is exactly the state
          # where the two URLs disagree for a cache lifetime.
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/install.sh" "/install"

  # ---------------------------------------------------------------------------
  # ENS-538 — notify the release orchestrator that this tag has finished
  # publishing. The orchestrator (in enscrive-cli) auto-bumps the
  # enscrive-deploy channels/dev.toml [overrides] entry for this repo and
  # dispatches manifest.yml to publish a fresh latest.json.
  #
  # A publish that cannot be pinned into the channel must be RED, not green.
  # This job used to be continue-on-error, which let a dead/unset PAT leave
  # the whole release run green while the binary was never pinned — see
  # enscrive-governance audit 2026-08-28-RELEASE-PIPELINE-SILENT-PIN-FAILURE.
  # It now fails the run so the ENS-1177 alert job below actually fires.
  #
  # Notification gates on signing so an unsigned release cannot advance the
  # dev channel manifest.
  # ---------------------------------------------------------------------------
  notify-orchestrator:
    name: notify release orchestrator (ENS-538)
    needs: [build, publish, aggregate, sign, publish-installer]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Dispatch release-published to orchestrator
        env:
          ORCHESTRATOR_PAT: ${{ secrets.ENSCRIVE_ORCHESTRATOR_PAT }}
          REF_NAME: ${{ needs.publish.outputs.ref_name }}
          LC_ALL: C
        run: |
          set -euo pipefail
          if [ -z "${ORCHESTRATOR_PAT}" ]; then
            echo "::error::ENSCRIVE_ORCHESTRATOR_PAT not configured — binary published but NOT pinned into the dev channel (ENS-538)"
            echo "Set the secret per ENS-538 to enable auto-publish."
            exit 1
          fi
          [[ "${REF_NAME}" =~ ^v[0-9]{8}-[0-9]{4}(-[0-9a-f]{7})?$ ]] || { echo "::error::invalid release ref '${REF_NAME}'"; exit 1; }
          REPO="${GITHUB_REPOSITORY##*/}"
          echo "Notifying orchestrator: repo=${REPO} version=${REF_NAME}"
          PAYLOAD="$(jq -n --arg repo "${REPO}" --arg version "${REF_NAME}" '{event_type: "release-published", client_payload: {repo: $repo, version: $version}}')"
          printf '%s\n' "${PAYLOAD}" | GH_TOKEN="${ORCHESTRATOR_PAT}" gh api -X POST repos/enscrive/enscrive-cli/dispatches --input -
          echo "Notification dispatched."

  # ---------------------------------------------------------------------------
  # ENS-1177 — release-failure alerting. A failed release previously went
  # silent for three weeks (ct-tui v20260709-1611 cosign fetch SPOF left
  # enscrive-probe frozen on v20260619-2225, nothing alerted). This job files
  # (or comments on) a GitHub issue whenever a required job in this workflow
  # fails, so a broken release surfaces instead of rotting quietly.
  # A cancelled release job alerts like a failure.
  # ---------------------------------------------------------------------------
  notify-on-failure:
    name: alert on release failure (ENS-1177)
    needs: [build, publish, aggregate, sign, publish-installer, notify-orchestrator]
    if: ${{ failure() || cancelled() || contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: File or update release-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          SIGN_RESULT: ${{ needs.sign.result }}
          INSTALLER_RESULT: ${{ needs.publish-installer.result }}
          NOTIFY_RESULT: ${{ needs.notify-orchestrator.result }}
          PUBLISHED_REF: ${{ needs.publish.outputs.ref_name }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          LC_ALL: C
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          REF="${PUBLISHED_REF}"
          if [ -z "${REF}" ]; then
            if [[ "${WORKFLOW_REF_NAME}" =~ ^v[0-9]{8}-[0-9]{4}(-[0-9a-f]{7})?$ ]]; then
              REF="${WORKFLOW_REF_NAME}"
            else
              REF="unresolved-ref"
            fi
          fi
          TITLE="release failed: ${REF}"
          RESULTS="build=${BUILD_RESULT}, publish=${PUBLISH_RESULT}, aggregate=${AGGREGATE_RESULT}, sign=${SIGN_RESULT}, publish-installer=${INSTALLER_RESULT}, notify-orchestrator=${NOTIFY_RESULT}"

          gh label create "release-failure" --repo "${REPO}" \
            --color "B60205" \
            --description "Automated: a release workflow run failed (ENS-1177)" \
            2>/dev/null || true

          EXISTING=$(gh issue list --repo "${REPO}" --label "release-failure" --state open \
            --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')

          BODY="Release workflow failed or was cancelled for \`${REPO}\` on ref \`${REF}\`.

          Run: ${RUN_URL}

          Results: ${RESULTS}

          Filed automatically by the ENS-1177 release-failure alert job. A prior silent failure (ct-tui cosign fetch SPOF, 2026-07-09) froze enscrive-probe for three weeks with no alert — this exists so that doesn't happen again."

          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --repo "${REPO}" --body "Recurred: ${RUN_URL} (${RESULTS})"
            echo "Commented on existing issue #${EXISTING}."
          else
            gh issue create --repo "${REPO}" --title "${TITLE}" --body "${BODY}" --label "release-failure"
            echo "Filed new release-failure issue."
          fi
